<title>Caesar: Recall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Nanum+Pen+Script&family=Special+Elite&family=Courier+Prime:ital@0;1&family=DotGothic16&display=swap">
<style>
/* Layout: one fixed 3200x2000 "monitor" stage drawn in the artist's pen-and-ink frames, scaled to fit the window.
   Deliberately single-look (grey desktop, white paper, black ink), so no dark-theme variant. */
:root{
  --void:#0e0e10;      /* letterbox around the monitor */
  --paper:#ffffff;     /* window & chat paper */
  --ink:#141414;       /* pen line */
  --graphite:#6b6b6e;  /* secondary pencil text */
  --dim:rgba(6,6,8,.66);
  --oil:#0b0707;       /* what Caesar bleeds */
  --hand:'Architects Daughter','Comic Sans MS','Segoe Print',cursive;
  --diary:'Nanum Pen Script','Segoe Print','Bradley Hand',cursive;
  --print:'Special Elite','Courier New',monospace;
  --type:'Courier Prime','Courier New',monospace;
  --sys:'DotGothic16','Courier New',monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);overflow:hidden;font-family:var(--hand);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;touch-action:none}
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:3200px;height:2000px;transform-origin:0 0;overflow:hidden;background:#555}
#shake{position:absolute;inset:0}
.abs{position:absolute}
.layer{position:absolute;inset:0}
.layer[hidden]{display:none!important}
.bg{position:absolute;inset:0;width:3200px;height:2000px;max-width:none}
img.sprite{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none}

/* ---------- login ---------- */
#login .bg{filter:brightness(.82)}
#loginFrame{transition:transform .2s}
#loginFrame.shake{animation:nudge .35s}
@keyframes nudge{20%{transform:translateX(-14px) rotate(-.4deg)}50%{transform:translateX(12px)}80%{transform:translateX(-6px)}}
#loginBox{left:985px;top:1192px;width:1100px;height:160px}
#nameInput{position:absolute;left:1005px;top:1200px;width:1060px;height:144px;border:0;outline:0;background:transparent;
  font-family:var(--hand);font-size:92px;color:var(--ink);text-align:center;letter-spacing:.06em;padding:0 40px;caret-color:var(--ink)}
#nameInput::placeholder{color:#b9b9bc;font-size:66px;letter-spacing:.08em}
#nameInput:focus-visible{outline:none}
#enterBtn{position:absolute;left:1405px;top:1384px;width:260px;height:96px;border:0;background:transparent;cursor:pointer;padding:0;
  font-family:var(--hand);font-size:56px;color:var(--ink);letter-spacing:.12em;transition:transform .15s}
#enterBtn svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#enterBtn span{position:relative}
#enterBtn:hover,#enterBtn:focus-visible{transform:scale(1.07) rotate(-1deg);outline:none}
#enterBtn:disabled{opacity:.35;cursor:default;transform:none}
#loginX{position:absolute;left:722px;top:322px;width:110px;height:110px;cursor:pointer;background:transparent;border:0}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--hand);font-size:90px;color:#ddd;background:#333;z-index:99}

/* ---------- character ---------- */
#charBox{position:absolute;overflow:hidden;pointer-events:none}
#charSvg{position:absolute;left:0;top:0;width:3200px;height:2000px;overflow:visible;transform-origin:0 0}
#charBox.glitch #charSvg{filter:drop-shadow(14px 0 0 rgba(255,0,70,.75)) drop-shadow(-14px 0 0 rgba(0,240,255,.75))}
#charBox.spot{z-index:40;filter:drop-shadow(0 0 28px rgba(255,255,255,.9))}
#charBox.glow{animation:glow 1s ease-out}
@keyframes glow{0%{filter:brightness(2.2) drop-shadow(0 0 60px #fff)}100%{filter:drop-shadow(0 0 28px rgba(255,255,255,.9))}}

/* ---------- prechat ---------- */
#chatLog{position:absolute;left:1795px;top:480px;width:890px;height:1120px;overflow:hidden;font-size:88px;line-height:1.38}
#chatLog p{margin:0}
.preUI{transition:opacity .8s ease}
.preUI.off{opacity:0}
#charBox.zoom{transition:clip-path 1.5s cubic-bezier(.6,0,.2,1)}
#charBox.zoom #charSvg{transition:transform 1.5s cubic-bezier(.6,0,.2,1)}
.next{position:absolute;width:56px;height:72px;animation:bob 1s ease-in-out infinite;transform:rotate(90deg);pointer-events:none}
@keyframes bob{50%{translate:0 14px}}
#preNext{left:2600px;top:1650px}
#preHint{position:absolute;left:1795px;top:1668px;font-size:44px;color:var(--graphite)}

/* ---------- desktop ---------- */
#chatS{position:absolute;left:730px;top:1296px;width:1040px;height:140px;font-size:50px;line-height:1.36;overflow:hidden}
#deskNext{left:1726px;top:1400px;width:38px;height:50px}
.file{position:absolute;cursor:grab;transition:transform .16s ease;touch-action:none}
.file img{position:absolute;top:0;max-width:none;pointer-events:none;-webkit-user-drag:none}
.file .open{display:none}
.file.hover{transform:scale(1.1);z-index:5}
.file.hover .open{display:block}
.file.hover .closed.hasopen{visibility:hidden}
.file.dragging{transition:none;z-index:30;cursor:grabbing;filter:drop-shadow(10px 16px 0 rgba(0,0,0,.25))}
.file.home{transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.file.done{opacity:.55}
.file:focus-visible{outline:6px dashed var(--paper);outline-offset:10px}
#uploadBox{position:absolute;left:1109px;top:227px;width:605px;height:788px;transition:transform .15s}
#uploadBox.over{transform:scale(1.05) rotate(-1deg)}
#uploadBox img{position:absolute;inset:0;width:100%;height:100%}
#prog{position:absolute;left:1100px;top:1030px;width:620px;height:130px}

/* ---------- windows ---------- */
#dim{position:absolute;inset:0;background:var(--dim);opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
#dim.on{opacity:1;pointer-events:auto}
.win{position:absolute;z-index:30;transform-origin:50% 50%;animation:pop .22s cubic-bezier(.3,1.4,.6,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}}
.win>img.frame{position:absolute;inset:0;width:100%;height:100%;max-width:none;pointer-events:none}
.xbtn{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;border-radius:6px}
.xbtn:hover,.xbtn:focus-visible{background:rgba(0,0,0,.12);outline:none}
.wbody{position:absolute}

/* poster */
.poster{font-size:62px;line-height:1.55}
.poster h2{margin:0 0 64px;font-weight:400;font-size:80px;line-height:1.1;letter-spacing:.04em}
.poster p{margin:0}

/* news */
.news{font-family:var(--type);font-size:58px;line-height:1.6;color:var(--ink)}
.news h2{margin:0;font-family:var(--print);font-weight:400;font-size:116px;line-height:1.08;text-wrap:balance;padding-bottom:56px;border-bottom:5px solid var(--ink);margin-bottom:64px}
.news p{margin:0 0 48px}
.news .drop::first-letter{float:left;font-family:var(--print);font-size:200px;line-height:.8;padding:16px 22px 0 0}

/* diary */
.diary{--lh:96px;font-family:var(--diary);font-size:78px;line-height:var(--lh);color:#1c1c22;
  background:repeating-linear-gradient(to bottom,transparent 0 calc(var(--lh) - 2px),#c9d3e0 calc(var(--lh) - 2px) var(--lh));background-position:0 6px}
.diary .page{display:none}
.diary .page.on{display:block}
.diary .date{font-size:86px;letter-spacing:.04em;text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:12px;margin-bottom:var(--lh)}
.diary p{margin:0}
.diary .entry{margin-bottom:var(--lh)}
.arrow{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;transition:transform .15s}
.arrow img{width:100%;height:100%;max-width:none;pointer-events:none}
.arrow:hover,.arrow:focus-visible{transform:scale(1.1);outline:none}
.arrow.pulse{animation:pulse .6s ease-in-out 5}
@keyframes pulse{50%{transform:scale(1.45)}}
#pageNo{position:absolute;font-family:var(--hand);font-size:60px;text-align:center}

/* photo caption */
.caption{font-family:var(--diary);font-size:96px;line-height:1;display:flex;justify-content:space-between;align-items:center}

/* clothes */
#btn4{position:absolute;border:0;padding:0;background:transparent;cursor:pointer;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
#btn4 img{width:100%;height:100%;max-width:none;pointer-events:none}
#btn4:hover,#btn4:focus-visible{transform:scale(1.09);outline:none}
#btn4:active{transform:scale(.96)}

/* ---------- effects ---------- */
#fx,#fly{position:absolute;inset:0;width:3200px;height:2000px;pointer-events:none;z-index:60}
#noise{position:absolute;inset:0;width:3200px;height:2000px;pointer-events:none;z-index:70;opacity:0;image-rendering:pixelated}
#popups{position:absolute;inset:0;pointer-events:none;z-index:65}
.popup{position:absolute;font-family:var(--hand);color:var(--ink)}
.popup svg.rr{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.popup .bar{position:relative;display:flex;align-items:center;gap:20px;padding:16px 22px 8px;font-family:var(--sys);font-size:38px;letter-spacing:.1em;border-bottom:5px solid var(--ink)}
.popup .bar i{width:40px;height:40px;border:5px solid var(--ink);display:grid;place-items:center;font-style:normal;font-size:30px;line-height:1}
.popup .msg{position:relative;padding:22px 30px;font-size:86px;line-height:1.08}
.popup.sys .msg{font-family:var(--sys);font-size:68px}
#stage.tear #shake{animation:tear .09s steps(2) infinite}
@keyframes tear{0%{transform:translate(-18px,6px) skewX(2deg)}50%{transform:translate(16px,-8px) skewX(-3deg)}100%{transform:translate(0,10px)}}
#stage.invert #shake{filter:invert(1) contrast(1.4)}
#blackout{position:absolute;inset:0;background:#000;z-index:80;display:grid;place-items:center;color:#e8e8e8;font-family:var(--sys);font-size:72px;letter-spacing:.08em}
#crashImg{position:absolute;inset:0;z-index:90;background:#fff}
#crashImg img{width:100%;height:100%;object-fit:cover;max-width:none}
#crashImg.in{animation:crashin .5s steps(5)}
@keyframes crashin{0%{filter:invert(1)}40%{filter:none;transform:translateX(30px)}60%{filter:invert(1);transform:translateX(-30px)}100%{filter:none}}

/* ---------- WINPART (placeholder) ---------- */
#winpart{position:absolute;inset:0;z-index:95;display:grid;place-items:center;background:rgba(255,255,255,.0);animation:winbg 1.2s forwards}
@keyframes winbg{to{background:rgba(255,255,255,.92)}}
#winpart .card{position:relative;width:1500px;padding:120px 80px 100px;text-align:center;animation:pop .5s .3s both cubic-bezier(.3,1.5,.6,1)}
#winpart .card svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#winpart h1{position:relative;margin:0;font-weight:400;font-size:280px;line-height:1;letter-spacing:.08em}
#winpart p{position:relative;margin:60px 0 0;font-size:60px;color:var(--graphite)}
#winpart button{position:relative;margin-top:50px;font-family:var(--hand);font-size:56px;padding:18px 60px;background:var(--paper);border:6px solid var(--ink);border-radius:30px 8px 34px 10px;cursor:pointer}
#winpart button:hover,#winpart button:focus-visible{transform:scale(1.06);outline:none}

#rotate{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;color:#bbb;font-family:var(--hand);font-size:15px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (prefers-reduced-motion:reduce){#stage.tear #shake{animation:none}.next{animation:none}}
</style>

<div id="viewport">
<div id="stage">
 <div id="shake">

 </div>

</div>
</div>
<div id="rotate" hidden>Turn your phone sideways for a bigger screen.</div>

/* ---------- seeded hand-drawn rectangles ---------- */
function rng(seed){let s=seed>>>0||1;return()=>(s=(s*1664525+1013904223)>>>0)/4294967296;}
function roughPath(w,h,seed,j){
  const r=rng(seed),J=()=>(r()-.5)*2*j,pts=[];
  const edge=(x0,y0,x1,y1,n)=>{for(let i=0;i<n;i++){const t=i/n;pts.push([x0+(x1-x0)*t+J(),y0+(y1-y0)*t+J()]);}};
  const n=Math.max(3,Math.round((w+h)/260));
  edge(0,0,w,0,n);edge(w,0,w,h,n);edge(w,h,0,h,n);edge(0,h,0,0,n);
  pts.push([pts[0][0]+J()+6,pts[0][1]+J()]);
  return 'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');
}
function roughSVG(w,h,seed,sw=7,fill='#fff'){
  return `<svg class="rr" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${roughPath(w,h,seed,sw*.7)}" fill="${fill}" stroke="#141414" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/><path d="${roughPath(w,h,seed+7,sw*.9)}" fill="none" stroke="#141414" stroke-width="${sw*.45}" stroke-linecap="round"/></svg>`;
}
document.querySelectorAll('svg[data-rough]').forEach(s=>{const [w,h,seed,sw]=s.dataset.rough.split(',').map(Number);s.outerHTML=roughSVG(w,h,seed,sw);});

function noise(d,v=.15,hp=200,at=0){const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=a.createGain();g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+at);}

function headXf(){const A=APP[C.app],g=C.g,t=performance.now()/1000;
  const sway=Math.sin(t*1.1)*1.1+C.look.x*1.4+(C.talk?Math.sin(t*7)*.6:0);

let last=performance.now();

  if(g.twitch>0&&!g.hold)g.twitch=Math.max(0,g.twitch-dt*.2);

function eyeStep(dt,h){const A=APP[C.app];
  C.g.eyes.forEach((b,i)=>{const s=xfPoint(h,A.sock[i]);
    b.vy+=1500*dt;const dx=b.x-s[0],dy=b.y-s[1],d=Math.hypot(dx,dy)||1,L=170;
    if(d>L){const f=(d-L)*40;b.vx-=dx/d*f*dt;b.vy-=dy/d*f*dt;}
    b.vx*=Math.pow(.35,dt);b.vy*=Math.pow(.35,dt);b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=b.vr*dt;b.vr*=Math.pow(.2,dt);
    const ball=i?E.ballR:E.ballL,cord=i?E.cordR:E.cordL;

    cord.setAttribute('d',`M${s[0].toFixed(1)} ${s[1].toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${b.x.toFixed(1)} ${(b.y-30).toFixed(1)}`);

const fx=$('fx'),fc=fx.getContext('2d'),fl=$('fly').getContext('2d');const P=[];let spray=null;
function drop(x,y,vx,vy,r,drip){P.push({x,y,vx,vy,r,life:.5+Math.random()*1.2,drip,stuck:false,len:0});}
function fxStep(dt,h){
  if(spray&&spray.t>0){spray.t-=dt;const s=charToStage(xfPoint({a:0,tx:0,ty:0,px:0,py:0},APP[C.app].stump));
    spray.acc=(spray.acc||0)+spray.rate*dt*(spray.t/spray.T);while(spray.acc>=1){spray.acc--;const ang=(-90+(Math.random()-.5)*80)*Math.PI/180,sp=500+Math.random()*1100;drop(s.x+(Math.random()-.5)*50,s.y,Math.cos(ang)*sp,Math.sin(ang)*sp,3+Math.random()*9,Math.random()<.4);}}
  fc.setTransform(.5,0,0,.5,0,0);fl.setTransform(1,0,0,1,0,0);fl.clearRect(0,0,1600,1000);fl.setTransform(.5,0,0,.5,0,0);fl.fillStyle='#0b0707';
  for(const p of P){
    if(!p.stuck){p.vy+=2600*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
      if(p.life<=0||p.y>1990){p.stuck=true;fc.fillStyle='#0b0707';splat(p.x,p.y,p.r*1.8);}
      else{const v=Math.hypot(p.vx,p.vy)||1;fl.beginPath();fl.ellipse(p.x,p.y,p.r*(1+Math.min(2,v/900)),p.r,Math.atan2(p.vy,p.vx),0,7);fl.fill();}}
    else if(p.drip&&p.len<200+p.r*20){const dl=dt*(30+p.r*6);fc.fillStyle='#0b0707';fc.fillRect(p.x-p.r*.35,p.y+p.len,p.r*.7,dl+1);p.len+=dl;
      fc.beginPath();fc.arc(p.x,p.y+p.len,p.r*.5,0,7);fc.fill();}
  }
  for(let i=P.length-1;i>=0;i--)if(P[i].stuck&&(!P[i].drip||P[i].len>=200+P[i].r*20))P.splice(i,1);
}
function splat(x,y,r){fc.beginPath();fc.arc(x,y,r,0,7);fc.fill();for(let i=0;i<5;i++){const a=Math.random()*7,d=r*(1+Math.random()*1.4);fc.beginPath();fc.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,r*.25*Math.random()+2,0,7);fc.fill();}}
function clearFx(){P.length=0;spray=null;fc.setTransform(1,0,0,1,0,0);fc.clearRect(0,0,fx.width,fx.height);fl.setTransform(1,0,0,1,0,0);fl.clearRect(0,0,1600,1000);}

  const end=e=>{if(!st)return;const p=toStage(e),was=st.drag;st=null;$('uploadBox').classList.remove('over');
    el.classList.remove('dragging');el.classList.add('home');el.style.transform='';
    if(e.pointerType!=='mouse')el.classList.remove('hover');
    if(was){if(overUpload(p))upload(f);return;}
    const now=performance.now();if(now-lastTap<420){lastTap=0;openWin(f);}else lastTap=now;};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',e=>{st=null;el.classList.remove('dragging');el.style.transform='';});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'){openWin(f);}else if(e.key===' '||e.key==='u'){e.preventDefault();upload(f);}});
}

/* ---------- upload outcomes ---------- */
async function upload(f){
  if(S.busy||S.win)return;
  if(f.poison)return poison();
  if(!f.ok)return overload(f);
  if(S.uploaded.has(f.id)){S.busy=true;await sayS(`I already have that one, ${NAME}. Find something else.`);S.busy=false;return;}
  S.busy=true;S.uploaded.add(f.id);S.progress++;f.el.classList.add('done');
  $('uploadImg').src='assets/success.png';$('prog').src=`assets/prog${S.progress}.png`;$('prog').alt=`${S.progress} of 3 uploaded`;
  sfx.ok();setSmile(true);C.g.bounce=26;
  await sayS(`Great! You uploaded the correct one!`);await wait(1400);
  $('uploadImg').src='assets/upload.png';setSmile(false);
  if(S.progress>=3){winpart();return;}
  const hints={file1:`That poster... XM-813. Is that me?`,file3:`Ida... that name feels warm.`,img:`I took this picture. I remember her back.`};
  await sayS(hints[f.id]);S.busy=false;
}

/* NEEDY-STREAMER-OVERLOAD style meltdown for a wrong file */
const POP_TXT=['WHO AM I','WHO AM I','who am i','THAT\'S NOT ME','caesar.exe is not responding','MEMORY CORRUPTED','ERROR 0x813','don\'t look at me','I\'m fine','I\'m fine I\'m fine I\'m fine','DATA LOST','why why why','please','SYSTEM OVERLOAD','where did you go','{n}?','{n} {n} {n}','STOP','i hate this','404 : self not found'];
function spawnPopup(){const w=520+Math.random()*560|0,h=230+Math.random()*170|0,el=document.createElement('div');el.className='popup'+(Math.random()<.35?' sys':'');
  el.style.cssText=`left:${Math.random()*(3200-w)|0}px;top:${Math.random()*(2000-h)|0}px;width:${w}px;height:${h}px;transform:rotate(${(Math.random()-.5)*6}deg)`;
  const txt=POP_TXT[Math.random()*POP_TXT.length|0].split('{n}').join(NAME);
  el.innerHTML=roughSVG(w,h,Math.random()*1e6|0,7)+`<div class="bar"><i>×</i>CAESAR.EXE</div><div class="msg"></div>`;el.querySelector('.msg').textContent=txt;
  $('popups').appendChild(el);if(Math.random()<.5)sfx.glitch();}
const GL='#@8!3%&¥$█▓▒░ｶｲｻﾙ?!/\\';
const corrupt=(s,a)=>[...s].map(c=>c!==' '&&Math.random()<a?GL[Math.random()*GL.length|0]:c).join('');
async function overload(f){
  S.busy=true;S.locked=true;
  await sayS(`That's... not me. No. No no no.`,26);
  charBox.classList.add('glitch');C.g.twitch=.6;C.g.hold=true;sfx.glitch();
  const base=`THAT'S NOT ME. THAT'S NOT ME. WHO AM I?`;let a=0;
  const iv=setInterval(()=>{a=Math.min(.85,a+.04);$('chatS').textContent=corrupt(base,a);C.g.twitch=.6+a;},90);
  let n=0;const pop=setInterval(()=>{spawnPopup();if(++n>6)spawnPopup();},Math.max(60,140));
  await wait(1200);stage.classList.add('tear');setNoise(.12);sfx.drone(3);
  const inv=setInterval(()=>stage.classList.toggle('invert',Math.random()<.3),110);
  await wait(1600);setNoise(.35);
  await wait(900);
  clearInterval(iv);clearInterval(pop);clearInterval(inv);
  await crashScreen('caesar.exe has stopped responding');
  resetAfterCrash(`...Ugh, my head. That wasn't me, ${NAME}. Let's try again.`);
}

/* poison file: neck snaps, eyes pop */
async function poison(){
  S.busy=true;S.locked=true;
  await sayS(`Hm? This one feels so cold—`,30);
  C.g.twitch=.5;C.g.hold=true;sfx.glitch();$('chatS').textContent='—';
  await wait(900);
  // SNAP
  const n=C.app;C.g.twitch=0;C.g.hold=false;
  E['neck'+n].setAttribute('clip-path',`url(#neckCut${n})`);E['stump'+n].setAttribute('visibility','visible');E['torn'+n].setAttribute('visibility','visible');
  C.g.target=n===1?84:78;C.g.va=900;C.g.tx=n===1?70:60;C.g.ty=n===1?95:85;
  sfx.crack();stage.classList.add('tear');setTimeout(()=>stage.classList.remove('tear'),380);
  spray={t:1.4,T:1.4,rate:150};
  $('chatS').textContent='I— I— I—';
  await wait(1200);
  eyePop();sfx.pop();stage.classList.add('tear');setTimeout(()=>stage.classList.remove('tear'),260);
  const msg=`I CAN'T SEE YOU ${NAME.toUpperCase()}  `;let a=0;
  const iv=setInterval(()=>{a=Math.min(.7,a+.03);$('chatS').textContent=corrupt(msg.repeat(4),a*.6);},120);
  await wait(1800);sfx.drone(2);setNoise(.18);
  const inv=setInterval(()=>stage.classList.toggle('invert',Math.random()<.18),140);
  await wait(1200);setNoise(.4);await wait(500);
  clearInterval(iv);clearInterval(inv);
  await crashScreen('');
  resetAfterCrash(`...It's you, ${NAME}. Everything went black. Don't give me that one again.`);
}
async function crashScreen(text){
  stage.classList.remove('tear','invert');setNoise(0);
  const bo=$('blackout');bo.textContent=text;bo.hidden=false;sfx.crack();await wait(text?900:250);
  const ci=$('crashImg');ci.hidden=false;ci.classList.remove('in');void ci.offsetWidth;ci.classList.add('in');bo.hidden=true;
  // reset the desktop behind the image while it shows
  $('popups').innerHTML='';clearFx();restoreChar();
  await wait(3000);
  ci.hidden=true;
}
function restoreChar(){const g=C.g;Object.assign(g,{a:0,tx:0,ty:0,va:0,target:null,twitch:0,hold:false,eyes:null,bounce:0});
  [1,2].forEach(n=>{E['neck'+n].removeAttribute('clip-path');['stump','torn','sockets'].forEach(k=>E[k+n].setAttribute('visibility','hidden'));});
  E.eyeballs.setAttribute('visibility','hidden');charBox.classList.remove('glitch');setSmile(false);}
async function resetAfterCrash(line){
  // progress stays where it was before the bad upload
  $('prog').src=`assets/prog${S.progress}.png`;$('uploadImg').src='assets/upload.png';
  S.locked=false;await wait(300);await sayS(line);S.busy=false;}

/* ---------- windows ---------- */
function closeWin(){if(!S.win)return;const w=S.win;
  if(w.kind==='diary'&&S.diary.seen.size<3&&!S.diary.warned){S.diary.warned=true;w.el.querySelectorAll('.arrow:not([hidden])').forEach(a=>{a.classList.remove('pulse');void a.offsetWidth;a.classList.add('pulse');});sfx.glitch();return;}
  w.el.remove();S.win=null;$('dim').classList.remove('on');charBox.classList.remove('spot','glow');sfx.close();
}
$('dim').addEventListener('click',()=>{});
addEventListener('keydown',e=>{if(e.key==='Escape')closeWin();});
function mkWin(key,kind,xBox){const b=M[key],el=document.createElement('div');el.className='win';place(el,b);el.setAttribute('role','dialog');
  const src=`assets/${key}.png`;
  el.innerHTML=`<img class="frame" src="${src}" alt="">`;
  const x=document.createElement('button');x.className='xbtn';x.setAttribute('aria-label','Close');place(x,[xBox[0]-b[0],xBox[1]-b[1],xBox[2],xBox[3]]);x.addEventListener('click',closeWin);el.appendChild(x);
  $('wins').appendChild(el);S.win={el,kind};$('dim').classList.add('on');sfx.open();setTimeout(()=>x.focus({preventScroll:true}),50);return el;}
function body(el,winKey,box,html,cls){const b=M[winKey],d=document.createElement('div');d.className='wbody '+(cls||'');place(d,[box[0]-b[0],box[1]-b[1],box[2],box[3]]);d.innerHTML=html;el.appendChild(d);return d;}
function openWin(f){if(S.win||S.busy)return;f.el.classList.remove('hover');
  ({poster:openPoster,news:openNews,diary:openDiary,clothes:openClothes,poison:openPoison,photo:openPhoto})[f.win]();}

   <h2>Abzodiac and Humanoid Robotics</h2>

const DIARY=[
 [['3039.11.28',"My brother is dead. Now it's just me and the female bot he left behind in this house. Honestly, I'm not sad at all. I just have no idea how to live with this machine."],
  ['3039.12.4',"Some stuff happened last night, and okay, I don't dislike her that much now. Today, we decided her name is Caesar. I absolutely love it because of Julius Caesar."]],
 [['3040.3.21',"People's feelings about robots are flipping. Everyone wants them out of their lives now. I thought it was nothing, but after that rally the other day… God, I'm so scared for Caesar. If you want to destroy them, why create them at all?"],
  ['3040.4.5',"We have to leave"]],
 [['3040.8.20',"I can finally bring myself to write this after a few days.\nI made an AI program just to speak to Caesar again. Caesar died on August 13. Her serial number is xm813. Was this fate all along?\nThe government ordered the destruction of all robots. People grew overly reliant on them, lost and discouraged. And honestly, they were right. But still, I can't accept that she's gone.\nWe were almost across the border when they caught us. To save me while I was unconscious, Caesar gave herself up to them. Her chip was handed back to me, crushed and broken, most of her memories wiped.\nThis AI Caesar doesn't know who I am. I don't have words for this.\nHow am I supposed to live without you?"]]];
function openDiary(){const el=mkWin('win3','diary',[1160,58,104,96]);const D=S.diary;
  const pg=body(el,'win3',[1290,170,1500,1500],'','diary');
  DIARY.forEach((entries,i)=>{const p=document.createElement('div');p.className='page';
    entries.forEach(([d,t])=>{const e=document.createElement('div');e.className='entry';const h=document.createElement('div');h.className='date';h.textContent=d;e.appendChild(h);
      t.split('\n').forEach(par=>{const q=document.createElement('p');q.textContent=par;e.appendChild(q);});p.appendChild(e);});
    pg.appendChild(p);});
  const b=M.win3;
  const mkA=(k,dir)=>{const a=document.createElement('button');a.className='arrow';a.setAttribute('aria-label',dir<0?'Previous page':'Next page');
    place(a,[M[k][0]-b[0],M[k][1]-b[1],M[k][2],M[k][3]]);a.innerHTML=`<img src="assets/${k}.png" alt="">`;a.addEventListener('click',()=>{D.page=Math.max(0,Math.min(2,D.page+dir));D.seen.add(D.page);sfx.open();render();});el.appendChild(a);return a;};
  const L=mkA('arrowL',-1),R=mkA('arrowR',1);

    // the last page is the longest entry, so it uses tighter ruling
    pg.style.setProperty('--lh',D.page===2?'80px':'96px');pg.style.fontSize=D.page===2?'64px':'';}
  render();}

function sparkle(){const A=APP[C.app];for(let i=0;i<16;i++){const s=document.createElement('div');const x=300+Math.random()*900,y=200+Math.random()*1000;

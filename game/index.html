<title>Caesar: Recall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Nanum+Pen+Script&family=Special+Elite&family=Courier+Prime:ital@0;1&family=DotGothic16&display=swap">
<style>
/* Layout: one fixed 3200x2000 "monitor" stage drawn in the artist's pen-and-ink frames, scaled to fit the window.
   Deliberately single-look (grey desktop, white paper, black ink), so no dark-theme variant. */
:root{
  --void:#0e0e10;      /* letterbox around the monitor */
  --paper:#ffffff;     /* window & chat paper */
  --ink:#141414;       /* pen line */
  --graphite:#6b6b6e;  /* secondary pencil text */
  --dim:rgba(6,6,8,.66);
  --oil:#0b0707;       /* what Caesar bleeds */
  --hand:'Architects Daughter','Comic Sans MS','Segoe Print',cursive;
  --diary:'Nanum Pen Script','Segoe Print','Bradley Hand',cursive;
  --print:'Special Elite','Courier New',monospace;
  --type:'Courier Prime','Courier New',monospace;
  --sys:'DotGothic16','Courier New',monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);overflow:hidden;font-family:var(--hand);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;touch-action:none}
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:3200px;height:2000px;transform-origin:0 0;overflow:hidden;background:#555}
#shake{position:absolute;inset:0}
.abs{position:absolute}
.layer{position:absolute;inset:0}
.layer[hidden]{display:none!important}
.bg{position:absolute;inset:0;width:3200px;height:2000px;max-width:none}
img.sprite{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none}

/* ---------- login ---------- */
#login .bg{filter:brightness(.82)}
#loginFrame{transition:transform .2s}
#loginFrame.shake{animation:nudge .35s}
@keyframes nudge{20%{transform:translateX(-14px) rotate(-.4deg)}50%{transform:translateX(12px)}80%{transform:translateX(-6px)}}
#loginBox{left:985px;top:1192px;width:1100px;height:160px}
/* Caesar's head bops side to side in hard steps, like a pixel-game sprite */
#loginHead{left:1080px;top:581px;width:911px;height:589px;transform-origin:416px 425px;animation:headBop .9s steps(1,end) infinite}
/* pivot = Caesar's nose (1496,1006 in the login art) */
@keyframes headBop{
  0%{transform:translate(-8px,0) rotate(-5deg)}
  16.6%{transform:translate(-4px,-8px) rotate(-2.5deg)}
  33.3%{transform:translate(0,-12px) rotate(0deg)}
  50%{transform:translate(8px,0) rotate(5deg)}
  66.6%{transform:translate(4px,-8px) rotate(2.5deg)}
  83.3%{transform:translate(0,-12px) rotate(0deg)}}
#loginHead.hop{animation:headHop .16s steps(1,end)}
@keyframes headHop{0%{transform:translate(0,-26px) scale(1.04,.96)}50%{transform:translate(0,-8px) scale(.98,1.03)}}
@media (prefers-reduced-motion:reduce){#loginHead{animation:none}}
#nameInput{position:absolute;left:1005px;top:1200px;width:1060px;height:144px;border:0;outline:0;background:transparent;
  font-family:var(--hand);font-size:92px;color:var(--ink);text-align:center;letter-spacing:.06em;padding:0 40px;caret-color:var(--ink)}
#nameInput::placeholder{color:#b9b9bc;font-size:66px;letter-spacing:.08em}
#nameInput:focus-visible{outline:none}
#enterBtn{position:absolute;left:1405px;top:1384px;width:260px;height:96px;border:0;background:transparent;cursor:pointer;padding:0;
  font-family:var(--hand);font-size:56px;color:var(--ink);letter-spacing:.12em;transition:transform .15s}
#enterBtn svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#enterBtn span{position:relative}
#enterBtn:hover,#enterBtn:focus-visible{transform:scale(1.07) rotate(-1deg);outline:none}
#enterBtn:disabled{opacity:.35;cursor:default;transform:none}
#loginX{position:absolute;left:722px;top:322px;width:110px;height:110px;cursor:pointer;background:transparent;border:0}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--hand);font-size:90px;color:#ddd;background:#333;z-index:99}

/* ---------- character ---------- */
#charBox{position:absolute;overflow:hidden;pointer-events:none}
#charSvg{position:absolute;left:0;top:0;width:3200px;height:2000px;overflow:visible;transform-origin:0 0}
#charBox.glitch #charSvg{filter:drop-shadow(14px 0 0 rgba(255,0,70,.75)) drop-shadow(-14px 0 0 rgba(0,240,255,.75))}
#charBox.spot{z-index:40;filter:drop-shadow(0 0 28px rgba(255,255,255,.9))}
#charBox.glow{animation:glow 1s ease-out}
@keyframes glow{0%{filter:brightness(2.2) drop-shadow(0 0 60px #fff)}100%{filter:drop-shadow(0 0 28px rgba(255,255,255,.9))}}

/* ---------- prechat ---------- */
#chatLog{position:absolute;left:1795px;top:480px;width:890px;height:1120px;overflow:hidden;font-size:88px;line-height:1.38}
#chatLog p{margin:0}
.preUI{transition:opacity .8s ease}
.preUI.off{opacity:0}
#charBox.zoom{transition:clip-path 1.5s cubic-bezier(.6,0,.2,1)}
#charBox.zoom #charSvg{transition:transform 1.5s cubic-bezier(.6,0,.2,1)}
.next{position:absolute;width:56px;height:72px;animation:bob 1s ease-in-out infinite;transform:rotate(90deg);pointer-events:none}
@keyframes bob{50%{translate:0 14px}}
#preNext{left:2600px;top:1650px}
#preHint{position:absolute;left:1795px;top:1668px;font-size:44px;color:var(--graphite)}

/* ---------- desktop ---------- */
#chatS{position:absolute;left:730px;top:1292px;width:1040px;height:152px;font-size:50px;line-height:1.36;overflow:hidden}
/* click Caesar or her chat box to see the upload request again */
.ask{position:absolute;border:0;padding:0;background:transparent;cursor:pointer;touch-action:none;-webkit-touch-callout:none}
.ask:focus-visible{outline:6px dashed var(--paper);outline-offset:-10px}
#deskNext{left:1726px;top:1400px;width:38px;height:50px}
.file{position:absolute;cursor:grab;transition:transform .16s ease;touch-action:none}
.file img{position:absolute;top:0;max-width:none;pointer-events:none;-webkit-user-drag:none}
.file .open{display:none}
.file.hover{transform:scale(1.1);z-index:5}
.file.hover .open{display:block}
.file.hover .closed.hasopen{visibility:hidden}
.file.dragging{transition:none;z-index:30;cursor:grabbing;filter:drop-shadow(10px 16px 0 rgba(0,0,0,.25))}
.file.home{transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.file.done{opacity:.55}
.file:focus-visible{outline:6px dashed var(--paper);outline-offset:10px}
#uploadBox{position:absolute;left:1109px;top:227px;width:605px;height:788px;transition:transform .15s}
#uploadBox.over{transform:scale(1.05) rotate(-1deg)}
#uploadBox img{position:absolute;inset:0;width:100%;height:100%}
#prog{position:absolute;left:1100px;top:1030px;width:620px;height:130px}
#uploadBox,#prog{transition:opacity .6s ease,transform .15s}
#uploadBox.gone,#prog.gone{opacity:0;pointer-events:none}
#charSvg.slide{transition:transform 1.2s cubic-bezier(.5,0,.2,1)}
/* step 3: Caesar asks for her maker's name; answered here instead of by upload */
#answerForm{position:absolute;left:543px;top:1010px;width:910px;height:110px;animation:pop .35s cubic-bezier(.3,1.4,.6,1)}
#answerForm[hidden]{display:none}
#answerBox{left:0;top:0;width:680px;height:110px;background:var(--paper)}
#answerInput{position:absolute;left:16px;top:6px;width:648px;height:98px;border:0;outline:0;background:transparent;font-family:var(--hand);font-size:62px;color:var(--ink);text-align:center;letter-spacing:.06em;caret-color:var(--ink)}
#answerInput::placeholder{color:#b9b9bc;font-size:50px}
#answerBtn{position:absolute;left:700px;top:7px;width:210px;height:96px;border:0;background:transparent;cursor:pointer;padding:0;font-family:var(--hand);font-size:52px;color:var(--ink);letter-spacing:.1em;transition:transform .15s}
#answerBtn svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#answerBtn span{position:relative}
#answerBtn:hover,#answerBtn:focus-visible{transform:scale(1.07) rotate(-1deg);outline:none}
#answerForm.no{animation:nudge .35s}

/* ---------- windows ---------- */
#dim{position:absolute;inset:0;background:var(--dim);opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
#dim.on{opacity:1;pointer-events:auto}
.win{position:absolute;z-index:30;transform-origin:50% 50%;animation:pop .22s cubic-bezier(.3,1.4,.6,1);cursor:grab;touch-action:none}
.win.moving{cursor:grabbing;animation:none;filter:drop-shadow(14px 22px 0 rgba(0,0,0,.35))}
@keyframes pop{from{transform:scale(.86);opacity:0}}
.win>img.frame{position:absolute;inset:0;width:100%;height:100%;max-width:none;pointer-events:none}
.xbtn{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;border-radius:6px}
.xbtn:hover,.xbtn:focus-visible{background:rgba(0,0,0,.12);outline:none}
.wbody{position:absolute}

/* poster */
.poster{font-size:62px;line-height:1.55}
.poster h2{margin:0 0 64px;font-weight:400;font-size:80px;line-height:1.1;letter-spacing:.04em}
.poster p{margin:0}

/* news */
.news{font-family:var(--type);font-size:58px;line-height:1.6;color:var(--ink)}
.news h2{margin:0;font-family:var(--print);font-weight:400;font-size:116px;line-height:1.08;text-wrap:balance;padding-bottom:56px;border-bottom:5px solid var(--ink);margin-bottom:64px}
.news p{margin:0 0 48px}
.news .drop::first-letter{float:left;font-family:var(--print);font-size:200px;line-height:.8;padding:16px 22px 0 0}

/* diary */
.diary{--lh:96px;font-family:var(--diary);font-size:78px;line-height:var(--lh);color:#1c1c22;
  background:repeating-linear-gradient(to bottom,transparent 0 calc(var(--lh) - 2px),#c9d3e0 calc(var(--lh) - 2px) var(--lh));background-position:0 6px}
.diary .page{display:none}
.diary .page.on{display:block}
.diary .date{font-size:86px;letter-spacing:.04em;text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:12px;margin-bottom:var(--lh)}
.diary p{margin:0}
.diary .entry{margin-bottom:var(--lh)}
/* Nanum Pen Script has a single weight, so bold is drawn as a thicker pen stroke */
.diary strong{font-weight:400;-webkit-text-stroke:2.4px currentColor}
.diary.isCover{background:none}
.diary .cover{height:100%;flex-direction:column;align-items:center;justify-content:center;gap:56px;text-align:center}
.diary .cover.on{display:flex}
.diary .label{position:relative;padding:70px 110px 80px}
.diary .label svg.rr{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.diary .cover h2{position:relative;margin:0;font-weight:400;font-size:210px;line-height:1;letter-spacing:.02em}
.diary .cover .years{font-size:76px;line-height:1;color:var(--graphite);letter-spacing:.08em}
.arrow{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;transition:transform .15s}
.arrow img{width:100%;height:100%;max-width:none;pointer-events:none}
.arrow:hover,.arrow:focus-visible{transform:scale(1.1);outline:none}
.arrow.pulse{animation:pulse .6s ease-in-out 5}
@keyframes pulse{50%{transform:scale(1.45)}}
#pageNo{position:absolute;font-family:var(--hand);font-size:60px;text-align:center}

/* photo caption */
.caption{font-family:var(--diary);font-size:96px;line-height:1;display:flex;justify-content:space-between;align-items:center}

/* clothes */
#btn4{position:absolute;border:0;padding:0;background:transparent;cursor:pointer;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
#btn4 img{width:100%;height:100%;max-width:none;pointer-events:none}
#btn4:hover,#btn4:focus-visible{transform:scale(1.09);outline:none}
#btn4:active{transform:scale(.96)}

/* ---------- effects ---------- */
#fx,#fly{position:absolute;inset:0;width:3200px;height:2000px;pointer-events:none;z-index:60}
#noise{position:absolute;inset:0;width:3200px;height:2000px;pointer-events:none;z-index:70;opacity:0;image-rendering:pixelated}
#popups{position:absolute;inset:0;pointer-events:none;z-index:65}
.popup{position:absolute;font-family:var(--hand);color:var(--ink)}
.popup svg.rr{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.popup .bar{position:relative;display:flex;align-items:center;gap:20px;padding:16px 22px 8px;font-family:var(--sys);font-size:38px;letter-spacing:.1em;border-bottom:5px solid var(--ink)}
.popup .bar i{width:40px;height:40px;border:5px solid var(--ink);display:grid;place-items:center;font-style:normal;font-size:30px;line-height:1}
.popup .msg{position:relative;padding:22px 30px;font-size:86px;line-height:1.08}
.popup.sys .msg{font-family:var(--sys);font-size:68px}
#stage.tear #shake{animation:tear .09s steps(2) infinite}
@keyframes tear{0%{transform:translate(-18px,6px) skewX(2deg)}50%{transform:translate(16px,-8px) skewX(-3deg)}100%{transform:translate(0,10px)}}
#stage.invert #shake{filter:invert(1) contrast(1.4)}
#blackout{position:absolute;inset:0;background:#000;z-index:80;display:grid;place-items:center;color:#e8e8e8;font-family:var(--sys);font-size:72px;letter-spacing:.08em}
#crashImg{position:absolute;inset:0;z-index:90;background:#fff}
#crashShake{position:absolute;inset:0;will-change:transform}
#crashShake img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
#crashShake .cset{position:absolute;inset:0}
/* colour flip: a white 'difference' layer inverts the picture without re-running the boil filter */
#crashImg::after{content:"";position:absolute;inset:0;background:#fff;mix-blend-mode:difference;opacity:0;pointer-events:none}
#crashImg.inv::after{opacity:1}
#crashImg.in{animation:crashin .5s steps(5)}
@keyframes crashin{0%{filter:invert(1)}40%{filter:none;transform:translateX(30px)}60%{filter:invert(1);transform:translateX(-30px)}100%{filter:none}}

/* after a wrong upload every drawn line on the desktop keeps boiling until the next right one */
.boiling{filter:url(#deskBoil)}
/* ---------- ending ---------- */
#ending{z-index:75;background:#000}
#ending .bg{filter:brightness(.82)}
#ending.flick{animation:flick .07s steps(2) infinite}
@keyframes flick{0%{opacity:1;filter:none}50%{opacity:.12;filter:invert(1)}}
#endCap,#titleCap{position:absolute;text-align:center;font-family:var(--hand);color:#fff;-webkit-text-stroke:14px var(--ink);paint-order:stroke fill;line-height:1.2}
#endCap{left:200px;right:200px;bottom:110px;font-size:104px}
#endFlash,#endFlash2{position:absolute;left:0;top:0;width:3200px;height:2000px;object-fit:cover;max-width:none;pointer-events:none}
#endFlash2{opacity:.55;mix-blend-mode:difference}
#endCv{position:absolute;inset:0;width:3200px;height:2000px}
/* last screen: almost pure black with c3 multiplied in, barely visible */
#titleDark{background:#050505}
#titleDark img{width:3200px;height:2000px;object-fit:cover;max-width:none;filter:invert(1);opacity:.1}
#titleCap{left:600px;width:1940px;top:1665px;font-size:92px;-webkit-text-stroke:12px var(--ink)}
#titleCap.last{left:200px;width:2800px;top:930px;font-size:110px}
#musicBtn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:100;width:44px;height:44px;border-radius:50%;
  border:3px solid #e8e8e8;background:rgba(14,14,16,.6);color:#e8e8e8;font:22px/1 var(--hand);cursor:pointer}
#musicBtn[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
#musicBtn:focus-visible{outline:3px dashed #e8e8e8;outline-offset:3px}
#rotate{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;color:#bbb;font-family:var(--hand);font-size:15px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (prefers-reduced-motion:reduce){#stage.tear #shake{animation:none}.next{animation:none}}
</style>

<div id="viewport">
<div id="stage">
 <div id="shake">
  <img class="bg" src="assets/background.jpg" alt="">

  <!-- 1. LOGIN -->
  <section id="login" class="layer">
    <div id="titleDark" class="layer" hidden><img src="assets/end_c3.jpg" alt=""></div>
    <div id="loginFrame" class="layer">
      <img class="sprite" data-m="login" alt="">
      <img class="sprite" id="loginHead" src="assets/loginhead.png" alt="">
      <img class="sprite" id="loginBox" src="assets/loginbox.png" alt="">
      <button id="loginX" aria-label="Close"></button>
      <form id="loginForm" autocomplete="off">
        <input id="nameInput" maxlength="14" placeholder="your name" aria-label="Your name" spellcheck="false">
        <button id="enterBtn" type="submit" disabled><svg data-rough="260,96,11,6" aria-hidden="true"></svg><span>ENTER</span></button>
      </form>
      <div id="titleCap" aria-live="polite" hidden></div>
    </div>
  </section>

  <!-- 2. CAESAR WELCOME -->
  <section id="prechat" class="layer" hidden>
    <img class="sprite preUI off" id="preFrame" src="assets/panel.png" style="left:432px;top:168px;width:2328px;height:1712px" alt="">
    <div id="preCharSlot"></div>
    <img class="sprite preUI off" id="preChat" data-m="chatm" alt="">
    <div id="chatLog" class="preUI off" aria-live="polite"></div>
    <div id="preHint" hidden>click to continue</div>
    <img class="next" id="preNext" src="assets/arrowR.png" hidden alt="">
  </section>

  <!-- 3. DESKTOP -->
  <section id="desktop" class="layer" hidden>
    <div id="deskArt" class="layer">
      <img class="sprite" data-m="panel" alt="">
      <div id="uploadBox"><img id="uploadImg" src="assets/upload.png" alt="Upload box"></div>
      <img class="sprite" id="prog" src="assets/prog0.png" alt="0 of 3 uploaded">
    </div>
    <div id="deskCharSlot"></div>
    <img class="sprite" id="chatsImg" data-m="chats" alt="">
    <div id="chatS" aria-live="polite"></div>
    <button class="ask" id="askChar" style="left:196px;top:141px;width:905px;height:1023px" aria-label="Ask Caesar what to upload"></button>
    <button class="ask" id="askChat" style="left:693px;top:1164px;width:1117px;height:306px" aria-label="Ask Caesar what to upload"></button>
    <img class="next" id="deskNext" src="assets/arrowR.png" hidden alt="">
    <form id="answerForm" autocomplete="off" hidden>
      <img class="sprite" id="answerBox" src="assets/loginbox.png" alt="">
      <input id="answerInput" maxlength="20" placeholder="type a name" aria-label="Who made Caesar?" spellcheck="false">
      <button id="answerBtn" type="submit"><svg data-rough="210,96,27,6" aria-hidden="true"></svg><span>ENTER</span></button>
    </form>
    <div id="files"></div>
    <div id="dim"></div>
    <div id="wins"></div>
  </section>

  <div id="popups"></div>
  <canvas id="fx" width="1600" height="1000"></canvas>
  <canvas id="fly" width="1600" height="1000"></canvas>
  <canvas id="noise" width="400" height="250"></canvas>

  <!-- ENDING: Caesar fills the screen, breaks, then the title page comes back -->
  <section id="ending" class="layer" hidden>
    <img class="bg" src="assets/background.jpg" alt="">
    <div id="endCharSlot"></div>
    <img id="endFlash" src="assets/end_c2.jpg" alt="" hidden>
    <img id="endFlash2" src="assets/end_c2.jpg" alt="" hidden>
    <div id="endCap" aria-live="polite"></div>
    <canvas id="endCv" width="1600" height="1000" hidden></canvas>
  </section>
 </div>
 <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="deskBoil" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence id="deskTurb" type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="2"/><feDisplacementMap in="SourceGraphic" scale="14"/></filter>
 </defs></svg>
 <div id="blackout" hidden></div>
 <div id="crashImg" hidden role="img" aria-label="Caesar crashing">
  <!-- "boiling" pen lines, as in the earlier Caesar Game: six pre-distorted frames (game/tools/boil_frames.py) swapped every 110ms -->
  <div id="crashShake">
   <div class="cset" data-set="crash"><img src="assets/crash0.jpg" alt=""><img src="assets/crash1.jpg" alt="" hidden><img src="assets/crash2.jpg" alt="" hidden><img src="assets/crash3.jpg" alt="" hidden><img src="assets/crash4.jpg" alt="" hidden><img src="assets/crash5.jpg" alt="" hidden></div>
   <div class="cset" data-set="c4" hidden><img src="assets/c4boil0.jpg" alt=""><img src="assets/c4boil1.jpg" alt="" hidden><img src="assets/c4boil2.jpg" alt="" hidden><img src="assets/c4boil3.jpg" alt="" hidden><img src="assets/c4boil4.jpg" alt="" hidden><img src="assets/c4boil5.jpg" alt="" hidden></div>
  </div>
 </div>
 <div id="loading">loading Caesar…</div>
</div>
</div>
<div id="rotate" hidden>Turn your phone sideways for a bigger screen.</div>
<!-- background music: put a track at assets/bgm.mp3; the button only appears once it loads -->
<audio id="bgm" src="assets/bgm.mp3" loop preload="auto"></audio>
<button id="musicBtn" type="button" aria-pressed="true" aria-label="Music on" hidden>♪</button>

<!-- Caesar, assembled from the artist's separate layers (coordinates are the 3200x2000 source canvas). -->
<template id="charTpl">
<div id="charBox">
<svg id="charSvg" viewBox="0 0 3200 2000" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <clipPath id="cp1L"><rect x="533" y="462" width="42" height="80"/></clipPath>
  <clipPath id="cp1R"><rect x="707" y="459" width="37" height="84"/></clipPath>
  <clipPath id="cp2L"><rect x="529" y="508" width="36" height="82"/></clipPath>

// browsers only allow sound after a click, so the music starts when the player presses ENTER.
// It starts on a plain <audio> element, then moves (at the same spot) onto a decoded Web Audio copy,
// so its speed and pitch can bend smoothly: warped during crashes, dragged down like a dying turntable in the ending.
const bgm=$('bgm'),musicBtn=$('musicBtn');let musicOn=true;
const BGM_VOL=.3; // kept under the typing blips and sound effects
try{musicOn=localStorage.getItem('caesar_music')!=='off';}catch(e){}
bgm.volume=BGM_VOL;

function showMusic(){musicBtn.setAttribute('aria-pressed',String(musicOn));musicBtn.setAttribute('aria-label',musicOn?'Music on':'Music off');}
let bgmBuf=null,bgmBufP=null,music=null,musicDone=false;
function loadBgmBuffer(){if(bgmBufP)return bgmBufP;const a=ac();if(!a)return Promise.resolve();
  bgmBufP=fetch('assets/bgm.mp3').then(r=>r.arrayBuffer()).then(b=>a.decodeAudioData(b)).then(buf=>{bgmBuf=buf;if(!bgm.paused)takeOver();}).catch(()=>{});return bgmBufP;}
function takeOver(){const a=ac();if(music||!a||!bgmBuf||musicDone)return;
  const src=a.createBufferSource(),lp=a.createBiquadFilter(),g=a.createGain(),wob=a.createOscillator(),wg=a.createGain();
  src.buffer=bgmBuf;src.loop=true;lp.type='lowpass';lp.frequency.value=18000;g.gain.value=musicOn?bgm.volume:0;
  wob.frequency.value=.8;wg.gain.value=0;wob.connect(wg).connect(src.playbackRate);
  src.connect(lp).connect(g).connect(a.destination);src.start(0,(bgm.currentTime||0)%bgmBuf.duration);wob.start();bgm.pause();
  music={src,lp,g,wob,wg,level:g.gain.value};}
function bgmStart(){if(musicDone)return;loadBgmBuffer();if(music)return;bgm.play().catch(()=>{});}
// glide to speed r over secs; wobble adds flutter; the sound also darkens as it slows
function musicRate(r,secs,wobble=0){
  if(!music){if(!bgm.paused){bgm.preservesPitch=false;bgm.webkitPreservesPitch=false;bgm.mozPreservesPitch=false;bgm.playbackRate=Math.max(.25,r);}return;} // fallback before decoding: rougher, same idea
  const t=AC.currentTime,p=music.src.playbackRate,f=music.lp.frequency;
  p.cancelScheduledValues(t);p.setValueAtTime(p.value,t);p.exponentialRampToValueAtTime(Math.max(.04,r),t+secs);
  f.cancelScheduledValues(t);f.setValueAtTime(f.value,t);f.exponentialRampToValueAtTime(Math.min(18000,Math.max(350,18000*r*r)),t+secs);
  music.wg.gain.setTargetAtTime(wobble,t,.25);}
function musicStop(fade=.05){musicDone=true;bgm.pause();if(!music)return;const m=music;music=null;m.g.gain.setTargetAtTime(0,AC.currentTime,fade);
  setTimeout(()=>{try{m.src.stop();m.wob.stop();}catch(e){}},fade*8000+50);}
// level follows the on/off button and dips while Caesar is typing so every blip is heard
function musicLevel(dt){const want=musicOn?BGM_VOL*(C.talk?.45:1):0;
  if(music){if(Math.abs(want-music.level)>.002){music.level=want;music.g.gain.setTargetAtTime(want,AC.currentTime,.15);}}
  else bgm.volume+=(want-bgm.volume)*Math.min(1,dt*6);}

      if(show){f1.style.transform=`translate(${(Math.random()-.5)*160}px,${(Math.random()-.5)*90}px) scale(${1+Math.random()*.15})`;

  await lagType(cap,`Thank you, thank you. Help me find my memory,`);

  let ws=0;const warpT=setInterval(()=>{ws=Math.min(30,ws+2);E.warpMap.setAttribute('scale',ws.toFixed(1));E.warpTurb.setAttribute('seed',String(1+Math.floor(Math.random()*9)));},90);
  await type(cap,`Thank you?`,110);

  E.headG1.removeAttribute('filter');E.warpMap.setAttribute('scale','0');E.grin1.setAttribute('visibility','hidden');E.mouth1.setAttribute('visibility','visible');
  C.pupS=1;restoreChar();
  end.hidden=true;$('desktop').hidden=true;$('login').hidden=false;

/* the ending crash: hard cuts between c2-c7 and the crash drawing, sliced, inverted, zoomed, with screams */
const HI={};['c2','c3','c4','c5','c6','c7'].forEach(k=>{const i=new Image();i.src=`assets/end_${k}.jpg`;HI[k]=i;});
HI.crash=new Image();HI.crash.src='assets/crash0.jpg';
function horror(){
  const cv=$('endCv'),x=cv.getContext('2d'),W=1600,H=1000;cv.hidden=false;
  const nz=document.createElement('canvas');nz.width=320;nz.height=200;const nx=nz.getContext('2d');
  const pick=a=>a[Math.random()*a.length|0];
  // draw an image covering the screen, zoomed by s around a focus point (fx,fy in 0..1 of the image)
  // (the point stays where it sits at s=1, so zooming "falls into" it)
  const draw=(img,s=1,fx=.5,fy=.5,ox=0,oy=0)=>{if(!img.width)return;const r=Math.max(W/img.width,H/img.height),w0=img.width*r,h0=img.height*r,w=w0*s,h=h0*s;
    x.drawImage(img,W/2-fx*w+(fx-.5)*w0+ox,H/2-fy*h+(fy-.5)*h0+oy,w,h);};
  const invert=()=>{x.globalCompositeOperation='difference';x.fillStyle='#fff';x.fillRect(0,0,W,H);x.globalCompositeOperation='source-over';};
  const slices=n=>{for(let i=0;i<n;i++){const y=Math.random()*H|0,h=8+Math.random()*90|0,dx=(Math.random()-.5)*220;x.drawImage(cv,0,y,W,h,dx,y,W,h);}};
  const noiseOver=a=>{if(a<=0)return;const d=nx.createImageData(320,200),b=d.data;for(let i=0;i<b.length;i+=4){const v=Math.random()*255|0;b[i]=b[i+1]=b[i+2]=v;b[i+3]=255;}
    nx.putImageData(d,0,0);x.globalAlpha=a;x.imageSmoothingEnabled=false;x.drawImage(nz,0,0,W,H);x.imageSmoothingEnabled=true;x.globalAlpha=1;};
  const words=n=>{x.fillStyle='#fff';x.strokeStyle='#000';x.lineWidth=8;for(let i=0;i<n;i++){x.font=`${40+Math.random()*120|0}px DotGothic16, monospace`;
    const w=pick(['THANK YOU','THANK YOU','thank you?','HELP ME','WHO AM I','IDA','IDA','IDA',`${NAME}`,'MEMORY NOT FOUND','I WAS']);const px=Math.random()*W,py=Math.random()*H;x.strokeText(w,px,py);x.fillText(w,px,py);}};
  return new Promise(res=>{const t0=performance.now();let cur='c6',dbl=null,next=0,punch=1,inv=false,ox=0,oy=0,beatAt=0,screamed=false;
    sfx.scream(.6,.08);musicRate(.24,1.1,.025); // the turntable loses power: everything drags down
    let braked=false,stopped=false;
    (function step(now){const t=(now-t0)/1000;x.globalCompositeOperation='source-over';x.fillStyle='#000';x.fillRect(0,0,W,H);
      let s=1,fx=.5,fy=.5,sl=0,na=0,wd=0,shake=0;
      if(t<1.3){ // the memory (c6) keeps tearing into c2
        if(now>next){cur=Math.random()<.65?'c6':'c2';next=now+(cur==='c6'?240:60);if(cur!=='c6')sfx.glitch();}
        s=1+t*.06;sl=t>.6?4:0;na=.06;shake=6;
        draw(HI[cur],s);}
      else if(t<4){ // frenzy: hard cuts, double exposures, inversion, slices, words
        if(now>next){cur=pick(['c2','c3','c4','c5','c7','crash']);dbl=Math.random()<.45?pick(['c2','c3','c4','c5','c7','crash']):null;
          next=now+35+Math.random()*95;punch=1+Math.random()*.45;inv=Math.random()<.4;ox=(Math.random()-.5)*120;oy=(Math.random()-.5)*80;if(Math.random()<.55)sfx.glitch();}
        draw(HI[cur],punch,.5,.5,ox,oy);
        if(dbl){x.globalCompositeOperation='difference';draw(HI[dbl],1.1,.5,.5,-ox,-oy);x.globalCompositeOperation='source-over';}
        sl=7;na=.14;wd=Math.random()<.5?3:0;shake=22;if(inv)invert();}
      else if(t<6){ // silence... slow push into the bleeding eye (c7), heartbeat
        const k=(t-4)/2;s=1+k*k*3.2;fx=.74;fy=.37;if(!braked){braked=true;musicRate(.16,1.8,.012);}
        draw(HI.c7,s,fx,fy);na=.05+k*.12;shake=k*8;
        if(t>beatAt){sfx.beat();beatAt=t+.75-k*.4;}
        if(Math.random()<.04)invert();}
      else if(t<6.35){ // jump scare
        if(!screamed){screamed=true;sfx.scream(1.6,.2);sfx.crack();musicRate(.13,.35,.02);}
        draw(HI.c3,1.35+(t-6)*1.5,.25,.42);if(Math.floor(t*30)%2)invert();sl=10;shake=40;}
      else if(t<7.8){ // falling into c4, strobing, the noise swallows everything
        const k=(t-6.35)/1.45;draw(HI.c4,1+k*2.4,.62,.45);if(Math.floor(t*16)%2)invert();sl=9;na=.2+k*.75;wd=2;shake=26;}
      else if(t<9.9){if(!stopped){stopped=true;musicStop();beep(.5,.7);}x.fillStyle='#000';x.fillRect(0,0,W,H);} // dead air, then a slow flatline beep
      else{cv.hidden=true;cv.style.transform='';res();return;}
      slices(sl);if(wd)words(wd);noiseOver(na);
      cv.style.transform=shake?`translate(${(Math.random()-.5)*shake*2}px,${(Math.random()-.5)*shake*2}px)`:'';
      requestAnimationFrame(step);})(t0);
  });
}

  const no=document.createElement('div');no.id='pageNo';place(no,[2400-b[0],1712-b[1],170,90]);el.appendChild(no);
  function render(){[...pg.children].forEach((p,i)=>p.classList.toggle('on',i===D.page+1));L.hidden=D.page===-1;R.hidden=D.page===2;no.textContent=D.page<0?'':`${D.page+1}/3`;
    pg.classList.toggle('isCover',D.page<0);
    // the last page is the longest entry, so it uses tighter ruling
    pg.style.setProperty('--lh',D.page===2?'80px':'96px');pg.style.fontSize=D.page===2?'64px':'';}
  render();}
